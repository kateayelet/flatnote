<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #F2F1ED;
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    color: #14120F;
  }
  .text { text-align: center; z-index: 2; }
  h1 {
    font-weight: 700; letter-spacing: -0.02em; line-height: 1.08;
    white-space: pre-line;
  }
  .sub {
    color: #55524C; font-weight: 400; line-height: 1.4; white-space: pre-line;
  }
  .shot {
    display: flex; justify-content: center; align-items: flex-start;
    flex: 1; min-height: 0;
  }
  /* The window capture already carries macOS chrome and rounded corners
     (transparent), so no device box: just a soft shadow under the window. */
  .shot img {
    display: block; max-width: 100%; max-height: 100%; object-fit: contain;
    filter: drop-shadow(0 40px 80px rgba(20, 18, 15, 0.28));
  }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 2880, H = +q.get('h') || 1800;
  document.body.style.width = W + 'px';
  document.body.style.height = H + 'px';
  const S = W / 2880;
  const shotW = Math.round((+q.get('shotw') || 2200) * S);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="text" style="margin-top:${Math.round(110 * S)}px; max-width:${Math.round(W * 0.86)}px">
      <h1 style="font-size:${Math.round((+q.get('h1s') || 108) * S)}px">${q.get('h1')}</h1>
      <div class="sub" style="font-size:${Math.round(46 * S)}px; margin-top:${Math.round(28 * S)}px">${q.get('sub') || ''}</div>
    </div>
    <div class="shot" style="width:${shotW}px; margin-top:${Math.round(70 * S)}px; padding-bottom:${Math.round(90 * S)}px">
      <img src="${q.get('img')}">
    </div>`);
</script>
</body>
</html>
