<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlatNote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #fdfdfc;
    --fg: #2c2c2c;
    --faded: #c0c0bd;
    --accent: #555;
    --code-bg: #f4f4f2;
    --hr-color: #e8e8e5;
    --font-body: 'Geist', -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    --font-mono: 'Geist Mono', 'SF Mono', 'Menlo', monospace;
    /* GitHub callout palette */
    --callout-note: #0969da;
    --callout-tip: #1a7f37;
    --callout-important: #8250df;
    --callout-warning: #9a6700;
    --callout-caution: #cf222e;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1b1a18;
        --fg: #d8d5cd;
        --faded: #565452;
        --accent: #bbb;
        --code-bg: #262523;
        --hr-color: #343230;
        --callout-note: #4493f8;
        --callout-tip: #3fb950;
        --callout-important: #ab7df8;
        --callout-warning: #d29922;
        --callout-caution: #f85149;
    }
}
html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.72;
    letter-spacing: 0.003em;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
}
#editor {
    min-height: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 26px 24px 200px 24px;
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
    caret-color: var(--fg);
}
#placeholder {
    position: absolute;
    top: 26px;
    left: 24px;
    right: 24px;
    max-width: 700px;
    margin: 0 auto;
    color: var(--faded);
    font-style: italic;
    pointer-events: none;
}

/* Line styles */
.line { min-height: 1.72em; }

/* Hanging indents: wrapped list/task lines align with the text after the
   marker, never the left margin. */
.line:has(.list-mk), .line:has(.task-raw), .line:has(.ol-mk) {
    padding-left: 1.4em;
    text-indent: -1.4em;
}
.line-h1 { font-size: 1.85em; font-weight: 700; line-height: 1.25; letter-spacing: -0.012em; margin: 0.7em 0 0.2em; }
.line-h2 { font-size: 1.45em; font-weight: 650; line-height: 1.3; letter-spacing: -0.008em; margin: 0.65em 0 0.15em; }
.line-h3 { font-size: 1.15em; font-weight: 650; line-height: 1.4; margin: 0.55em 0 0.1em; }
.line-h4, .line-h5, .line-h6 { font-weight: 600; }
.line-h6 { color: var(--faded); }
.line-quote {
    border-left: 3px solid var(--hr-color);
    padding-left: 12px;
    font-style: italic;
}
/* GitHub-style callouts: > [!NOTE] etc. colors the whole quote run and
   tints its background, so consecutive lines read as one box. Body text
   stays upright (callouts are asides, not quotations); the label line
   takes the type color. */
.line-callout {
    font-style: normal;
    padding-top: 2px;
    padding-bottom: 2px;
    padding-right: 8px;
}
.callout-head .callout-label { font-weight: 600; text-transform: capitalize; }
.callout-note { border-left-color: var(--callout-note); background: color-mix(in srgb, var(--callout-note) 7%, transparent); }
.callout-note .callout-label { color: var(--callout-note); }
.callout-tip { border-left-color: var(--callout-tip); background: color-mix(in srgb, var(--callout-tip) 7%, transparent); }
.callout-tip .callout-label { color: var(--callout-tip); }
.callout-important { border-left-color: var(--callout-important); background: color-mix(in srgb, var(--callout-important) 7%, transparent); }
.callout-important .callout-label { color: var(--callout-important); }
.callout-warning { border-left-color: var(--callout-warning); background: color-mix(in srgb, var(--callout-warning) 7%, transparent); }
.callout-warning .callout-label { color: var(--callout-warning); }
.callout-caution { border-left-color: var(--callout-caution); background: color-mix(in srgb, var(--callout-caution) 7%, transparent); }
.callout-caution .callout-label { color: var(--callout-caution); }
.line-code-block {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 2px 8px;
    border-radius: 3px;
}
.line-code-fence { color: var(--faded); font-family: var(--font-mono); font-size: 0.85em; }
.line-hr { border: none; border-top: 1px solid var(--hr-color); margin: 1em 0; min-height: 0; height: 0; }

/* Inline styles */
/* Syntax markers are present in the DOM (so cursor offsets stay exact) but
   hidden by default. They are revealed only on the line the cursor is in,
   via the .active-line class toggled from selectionchange. */
.mk { color: var(--faded); font-weight: 400; font-style: normal; font-size: 0; }
.line.active-line .mk { font-size: inherit; }
.md-bold { font-weight: 700; color: var(--fg); }
.md-italic { font-style: italic; color: var(--fg); }
.md-bolditalic { font-weight: 700; font-style: italic; color: var(--fg); }
.md-code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--code-bg);
    padding: 1px 4px;
    border-radius: 3px;
    color: var(--fg);
}
.md-strike { text-decoration: line-through; color: var(--accent); }
.md-link { color: #2563eb; text-decoration: underline; }

/* Unordered list: hide the raw "- "/"* " marker and draw a bullet instead.
   On the active line the raw marker is revealed and the bullet suppressed. */
.list-mk::before { content: "\2022\00a0\00a0"; font-size: 17px; color: var(--fg); }
.line.active-line .list-mk::before { content: none; }

/* Ordered list: the number is meaningful, so keep it visible. */
.ol-mk { color: var(--accent); }

/* Task checkboxes: the raw "- [ ] " uses .mk (hidden until active); the
   visual box is shown until the line is active, then swapped for the raw text. */
.task-cb-vis {
    display: inline-block; width: 17px; height: 17px;
    border: 1.5px solid var(--faded); border-radius: 4px;
    vertical-align: -3px; margin-right: 6px; cursor: pointer; position: relative;
}
/* Invisible hit-area expander: 17px + 2x14px ≈ a 45pt touch target. */
.task-cb-vis::before {
    content: ""; position: absolute; inset: -14px;
}
.task-cb-vis.checked { background: var(--accent); border-color: var(--accent); }
.task-cb-vis.checked::after {
    content: "\2713"; color: var(--bg); font-size: 14px; font-weight: 700;
    position: absolute; inset: 0; line-height: 1;
    display: flex; align-items: center; justify-content: center;
}
.line.active-line .task-cb-vis { display: none; }

/* Inline image blocks: raw "![alt](src)" hidden via .mk until the line is
   active; while active the image hides so the raw text is editable. */
.md-image { display: block; max-width: 100%; max-height: 60vh; border-radius: 8px; margin: 4px 0; }
.line.active-line .md-image { display: none; }

/* In-note find highlights */
mark.search-hit { background: rgba(253, 217, 94, 0.45); color: inherit; border-radius: 2px; }
mark.search-hit.current { background: #FDD95E; color: #1a1a1a; }

/* Formatting toolbar (shown above the keyboard while editing) */
#toolbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none;
    justify-content: space-around; align-items: center;
    height: 46px;
    background: var(--code-bg);
    border-top: 1px solid var(--hr-color);
    z-index: 10;
    -webkit-user-select: none; user-select: none;
}
#toolbar.visible { display: flex; }
#toolbar button {
    background: none; border: none; color: var(--fg);
    font-size: 18px; font-family: var(--font-body);
    padding: 8px 14px; min-width: 40px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
#toolbar button:active { opacity: 0.4; }
</style>
</head>
<body>
<div id="placeholder"># Title</div>
<div id="editor" contenteditable="true" spellcheck="true" autocapitalize="sentences" autocorrect="on"></div>
<div id="toolbar">
    <button data-fmt="bold" aria-label="Bold" style="font-weight:700">B</button>
    <button data-fmt="italic" aria-label="Italic" style="font-style:italic">I</button>
    <button data-fmt="heading" aria-label="Heading">H</button>
    <button data-fmt="bullet" aria-label="Bullet list">&#8226;</button>
    <button data-fmt="task" aria-label="Checkbox">&#9745;</button>
    <button data-fmt="callout" aria-label="Callout">[!]</button>
    <button data-fmt="sketch" aria-label="Sketch">&#9998;</button>
    <button data-fmt="attach" aria-label="Attach image">&#128206;</button>
</div>
<script src="render.js"></script>
<script>
(function() {
    const editor = document.getElementById('editor');
    const placeholder = document.getElementById('placeholder');
    let markdownSource = '';
    let isComposing = false;
    let enterHandled = false;

    // Undo/redo: the editor intercepts every input and re-renders from
    // markdownSource, so WebKit's native contenteditable undo stack is always
    // empty. We keep our own document snapshots instead.
    let undoStack = [];
    let redoStack = [];
    let lastEditType = null;
    let lastEditAt = 0;

    // --- Expose to Swift ---
    window.setContent = function(md) {
        markdownSource = md || '';
        // A freshly loaded document starts with an empty history; undo must
        // never cross into a different note or an external on-disk reload.
        undoStack = [];
        redoStack = [];
        lastEditType = null;
        render();
        updatePlaceholder();
        // No notifyChange here: this content just CAME from the host. Echoing
        // it back would rewrite the file on every open, dirtying mtimes (and
        // iCloud sync) for a note the user never touched. The outline still
        // needs to be told about the new document.
        notifyOutline();
    };
    window.getContent = function() { return markdownSource; };

    // Move the caret into the editor and focus it. On macOS the host makes the
    // web view first responder after loading and then calls this so the note is
    // immediately typable; without it the contenteditable never takes keystrokes.
    window.focusEditor = function() {
        editor.focus();
        const sel = window.getSelection();
        if (sel && editor.lastChild) {
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }
    };

    function updatePlaceholder() {
        placeholder.style.display = markdownSource.trim() === '' ? 'block' : 'none';
    }

    function postToHost(msg) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.flatnote) {
            window.webkit.messageHandlers.flatnote.postMessage(msg);
        }
    }

    function notifyChange() {
        postToHost({ action: 'contentChanged', markdown: markdownSource });
        notifyOutline();
    }

    // Gather the headings, in document order, for the outline panel. Lines
    // inside code fences render as code blocks (not .line-hN), so they are
    // naturally excluded.
    function buildOutline() {
        const items = [];
        editor.querySelectorAll('.line-h1, .line-h2, .line-h3, .line-h4, .line-h5, .line-h6')
            .forEach(div => {
                const m = div.className.match(/line-h([1-6])/);
                items.push({
                    level: m ? parseInt(m[1]) : 1,
                    line: parseInt(div.dataset.line),
                    text: div.textContent.replace(/^#{1,6}\s+/, '').trim()
                });
            });
        return items;
    }

    let lastOutlineJSON = '';
    function notifyOutline() {
        const items = buildOutline();
        const json = JSON.stringify(items);
        if (json === lastOutlineJSON) return;   // skip when headings are unchanged
        lastOutlineJSON = json;
        postToHost({ action: 'outline', items: items });
    }

    // ========================================
    // CURSOR MAPPING
    // ========================================
    // Key invariant: every line div's textContent === markdownSource line.
    // This means DOM text offset === markdown source offset. Always.

    function getLineDiv(node) {
        let el = node.nodeType === 3 ? node.parentElement : node;
        while (el && el !== editor) {
            if (el.dataset && el.dataset.line !== undefined) return el;
            el = el.parentElement;
        }
        return null;
    }

    function getLineIndex(node) {
        const div = getLineDiv(node);
        return div ? parseInt(div.dataset.line) : 0;
    }

    function getDOMOffset(container, offset) {
        const lineDiv = getLineDiv(container);
        if (!lineDiv) return 0;
        if (container === lineDiv) {
            let total = 0;
            for (let i = 0; i < offset && i < lineDiv.childNodes.length; i++) {
                total += lineDiv.childNodes[i].textContent.length;
            }
            return total;
        }
        let total = 0;
        const walker = document.createTreeWalker(lineDiv, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
            if (node === container) return total + offset;
            total += node.textContent.length;
        }
        return total + offset;
    }

    function getCursorPos() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return null;
        const range = sel.getRangeAt(0);
        const lineDiv = getLineDiv(range.startContainer);
        if (!lineDiv) return null;
        return {
            line: parseInt(lineDiv.dataset.line),
            offset: getDOMOffset(range.startContainer, range.startOffset)
        };
    }

    function getSelectionRange() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return null;
        const range = sel.getRangeAt(0);
        return {
            startLine: getLineIndex(range.startContainer),
            startOffset: getDOMOffset(range.startContainer, range.startOffset),
            endLine: getLineIndex(range.endContainer),
            endOffset: getDOMOffset(range.endContainer, range.endOffset),
            collapsed: range.collapsed
        };
    }

    function setCursor(lineIndex, charOffset) {
        _setCursorRaw(lineIndex, charOffset);
        updateActiveLine();
    }

    function _setCursorRaw(lineIndex, charOffset) {
        const lineDiv = editor.querySelector('[data-line="' + lineIndex + '"]');
        if (!lineDiv) return;
        // Clamp offset
        const maxOff = lineDiv.textContent.length;
        charOffset = Math.min(charOffset, maxOff);
        charOffset = Math.max(charOffset, 0);

        const walker = document.createTreeWalker(lineDiv, NodeFilter.SHOW_TEXT);
        let node, acc = 0;
        while ((node = walker.nextNode())) {
            const len = node.textContent.length;
            if (acc + len >= charOffset) {
                const sel = window.getSelection();
                const range = document.createRange();
                range.setStart(node, charOffset - acc);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
                return;
            }
            acc += len;
        }
        // Fallback: end of line
        const texts = [];
        const w = document.createTreeWalker(lineDiv, NodeFilter.SHOW_TEXT);
        let n;
        while ((n = w.nextNode())) texts.push(n);
        if (texts.length) {
            const last = texts[texts.length - 1];
            const sel = window.getSelection();
            const range = document.createRange();
            range.setStart(last, last.textContent.length);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            return;
        }
        // Empty line (only <br>, no text nodes): anchor cursor to the line div itself
        const sel = window.getSelection();
        const range = document.createRange();
        range.setStart(lineDiv, 0);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
    }

    // ========================================
    // INPUT HANDLING
    // ========================================

    editor.addEventListener('compositionstart', () => { isComposing = true; });
    editor.addEventListener('compositionend', () => {
        isComposing = false;
        syncCurrentLineFromDOM();
    });

    // keydown for Enter and Backspace (most reliable on iOS)
    let backspaceHandled = false;
    editor.addEventListener('keydown', (e) => {
        // Undo/redo via hardware keyboard (iOS) and as a macOS fallback. On
        // macOS the Edit menu's Cmd+Z key equivalent usually fires first and
        // routes through the native command into window.undo()/redo().
        if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
            e.preventDefault();
            if (e.shiftKey) window.redo(); else window.undo();
            return;
        }
        if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || e.key === 'Y')) {
            e.preventDefault();
            window.redo();
            return;
        }
        if (e.key === 'Enter' || e.keyCode === 13) {
            e.preventDefault();
            enterHandled = true;
            handleEnter();
        }
        if (e.key === 'Backspace' || e.keyCode === 8) {
            e.preventDefault();
            backspaceHandled = true;
            handleBackspace();
        }
    });

    // Image paste (and image-file drop routed here by WebKit as a paste):
    // ship the bytes to the host, which saves a real image file next to the
    // note and calls insertPastedImage with the relative path. Fires before
    // beforeinput; preventDefault stops the text path double-handling it.
    // The paste event is the one interception point that is cancelable on
    // every platform. beforeinput's insertFromPaste is not reliably
    // cancelable in macOS WebKit, and letting the native paste run corrupts
    // the line model: multi-line text lands inside one line div and its
    // newlines vanish in the textContent sync. So: always preventDefault,
    // route images to the host and text through handlePaste.
    editor.addEventListener('paste', (e) => {
        e.preventDefault();
        const items = (e.clipboardData && e.clipboardData.items) || [];
        for (const item of items) {
            if (item.kind === 'file' && item.type && item.type.indexOf('image/') === 0) {
                const file = item.getAsFile();
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = String(reader.result).split(',')[1] || '';
                    if (base64) postToHost({ action: 'pasteImage', data: base64, mime: item.type });
                };
                reader.readAsDataURL(file);
                return;
            }
        }
        const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
        if (text) handlePaste(text.replace(/\r\n?/g, '\n'));
    });

    // The nav-bar title is always the filename (host-side); no hide/show
    // handoff. The old scroll-linked toggle could wedge in the hidden state
    // after clipboard actions, leaving the note apparently untitled.

    // Called back by the host once the pasted image is on disk. The image
    // syntax only renders as a block on its own line, so surround it with
    // newlines rather than splicing it into the current line's text.
    let attachReturnPos = null;
    window.insertPastedImage = function(relPath) {
        if (!getSelectionRange() && attachReturnPos) {
            editor.focus();
            setCursor(attachReturnPos.line, attachReturnPos.offset);
        }
        attachReturnPos = null;
        handlePaste('\n![](' + relPath + ')\n');
    };

    editor.addEventListener('beforeinput', (e) => {
        if (isComposing) return;
        const t = e.inputType;

        if (t === 'historyUndo') { e.preventDefault(); window.undo(); return; }
        if (t === 'historyRedo') { e.preventDefault(); window.redo(); return; }

        // The system selection menu's B/I/U. Bold and italic map to Markdown;
        // underline is not Markdown, so it is swallowed rather than letting
        // execCommand write styling the file cannot hold.
        if (t === 'formatBold') { e.preventDefault(); window.fmtBold(); return; }
        if (t === 'formatItalic') { e.preventDefault(); window.fmtItalic(); return; }
        if (t === 'formatUnderline') { e.preventDefault(); return; }

        if (t === 'insertParagraph' || t === 'insertLineBreak') {
            e.preventDefault();
            if (!enterHandled) handleEnter();
            enterHandled = false;
            return;
        }
        enterHandled = false;

        if (t === 'insertText') {
            e.preventDefault();
            insertTextAtCursor(e.data || '');
            return;
        }

        if (t === 'deleteContentBackward') {
            e.preventDefault();
            if (!backspaceHandled) handleBackspace();
            backspaceHandled = false;
            return;
        }

        if (t === 'deleteContentForward') {
            e.preventDefault();
            handleDelete();
            return;
        }

        if (t === 'deleteWordBackward' || t === 'deleteSoftLineBackward' || t === 'deleteHardLineBackward') {
            e.preventDefault();
            handleDeleteWord('backward');
            return;
        }

        if (t === 'deleteWordForward' || t === 'deleteSoftLineForward' || t === 'deleteHardLineForward') {
            e.preventDefault();
            handleDeleteWord('forward');
            return;
        }

        if (t === 'insertFromPaste' || t === 'insertFromDrop') {
            e.preventDefault();
            const dt = e.dataTransfer;
            // A dragged-in image file takes the same path as a pasted one.
            if (dt && dt.files && dt.files.length && dt.files[0].type.indexOf('image/') === 0) {
                const file = dt.files[0];
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = String(reader.result).split(',')[1] || '';
                    if (base64) postToHost({ action: 'pasteImage', data: base64, mime: file.type });
                };
                reader.readAsDataURL(file);
                return;
            }
            const text = dt ? dt.getData('text/plain') : '';
            if (text) handlePaste(text);
            return;
        }

        if (t === 'insertReplacementText') {
            // Autocorrect/autocomplete
            e.preventDefault();
            const ranges = e.getTargetRanges();
            if (ranges.length > 0 && e.dataTransfer) {
                const replacement = e.dataTransfer.getData('text/plain');
                const r = ranges[0];
                const startLine = getLineIndex(r.startContainer);
                const startOff = getDOMOffset(r.startContainer, r.startOffset);
                const endLine = getLineIndex(r.endContainer);
                const endOff = getDOMOffset(r.endContainer, r.endOffset);
                pushUndo('replace');
                deleteRangeAndInsert(startLine, startOff, endLine, endOff, replacement);
            }
            return;
        }

        // Anything else: let it happen, sync after
    });

    editor.addEventListener('input', (e) => {
        if (isComposing) return;
        const handled = ['insertText', 'insertParagraph', 'insertLineBreak',
            'deleteContentBackward', 'deleteContentForward',
            'deleteWordBackward', 'deleteWordForward',
            'deleteSoftLineBackward', 'deleteSoftLineForward',
            'deleteHardLineBackward', 'deleteHardLineForward',
            'insertFromPaste', 'insertFromDrop', 'insertReplacementText'];
        if (handled.includes(e.inputType)) return;
        syncAllFromDOM();
    });

    // ========================================
    // EDIT OPERATIONS
    // ========================================

    function insertTextAtCursor(text) {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('insertText');
        if (!sr.collapsed) {
            deleteRangeAndInsert(sr.startLine, sr.startOffset, sr.endLine, sr.endOffset, text);
            return;
        }
        const lines = markdownSource.split('\n');
        const line = lines[sr.startLine] || '';
        lines[sr.startLine] = line.slice(0, sr.startOffset) + text + line.slice(sr.startOffset);
        markdownSource = lines.join('\n');
        render();
        setCursor(sr.startLine, sr.startOffset + text.length);
        updatePlaceholder();
        notifyChange();
    }

    function handleEnter() {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('enter');

        // Delete selection first if any
        if (!sr.collapsed) {
            deleteRangeRaw(sr.startLine, sr.startOffset, sr.endLine, sr.endOffset);
        }

        const pos = sr.collapsed ? sr : { startLine: sr.startLine, startOffset: sr.startOffset };
        const lines = markdownSource.split('\n');
        const currentLine = lines[pos.startLine] || '';
        const before = currentLine.slice(0, pos.startOffset);
        const after = currentLine.slice(pos.startOffset);

        // Auto-continue lists and quotes (quotes so multi-line callouts can
        // be typed straight through; Enter on an empty quote line ends it)
        let prefix = '';
        const taskMatch = currentLine.match(/^([-*])\s+\[([ xX])\]\s/);
        const bulletMatch = currentLine.match(/^([-*+])\s/);
        const orderedMatch = currentLine.match(/^(\d+)\.\s/);
        const quoteMatch = currentLine.match(/^(>\s?)/);

        // If empty list item, remove it
        if (taskMatch && before.match(/^[-*]\s+\[[ xX]\]\s*$/) && after.trim() === '') {
            lines[pos.startLine] = '';
            markdownSource = lines.join('\n');
            render(); setCursor(pos.startLine, 0);
        } else if (bulletMatch && !taskMatch && before.match(/^[-*+]\s*$/) && after.trim() === '') {
            lines[pos.startLine] = '';
            markdownSource = lines.join('\n');
            render(); setCursor(pos.startLine, 0);
        } else if (orderedMatch && before.match(/^\d+\.\s*$/) && after.trim() === '') {
            lines[pos.startLine] = '';
            markdownSource = lines.join('\n');
            render(); setCursor(pos.startLine, 0);
        } else if (quoteMatch && before.match(/^>\s*$/) && after.trim() === '') {
            lines[pos.startLine] = '';
            markdownSource = lines.join('\n');
            render(); setCursor(pos.startLine, 0);
        } else {
            if (taskMatch) prefix = taskMatch[1] + ' [ ] ';
            else if (bulletMatch && !taskMatch) prefix = bulletMatch[1] + ' ';
            else if (orderedMatch) prefix = (parseInt(orderedMatch[1]) + 1) + '. ';
            else if (quoteMatch) prefix = quoteMatch[1];

            lines.splice(pos.startLine, 1, before, prefix + after);
            markdownSource = lines.join('\n');
            render(); setCursor(pos.startLine + 1, prefix.length);
        }
        updatePlaceholder();
        notifyChange();
    }

    function handleBackspace() {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('delete');

        if (!sr.collapsed) {
            deleteRangeRaw(sr.startLine, sr.startOffset, sr.endLine, sr.endOffset);
            markdownSource = markdownSource; // already modified
            render(); setCursor(sr.startLine, sr.startOffset);
            updatePlaceholder(); notifyChange();
            return;
        }

        const lines = markdownSource.split('\n');
        if (sr.startOffset > 0) {
            const line = lines[sr.startLine];
            lines[sr.startLine] = line.slice(0, sr.startOffset - 1) + line.slice(sr.startOffset);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.startOffset - 1);
        } else if (sr.startLine > 0) {
            const prevLen = lines[sr.startLine - 1].length;
            lines[sr.startLine - 1] += lines[sr.startLine];
            lines.splice(sr.startLine, 1);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine - 1, prevLen);
        }
        updatePlaceholder(); notifyChange();
    }

    function handleDelete() {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('delete');

        if (!sr.collapsed) {
            deleteRangeRaw(sr.startLine, sr.startOffset, sr.endLine, sr.endOffset);
            render(); setCursor(sr.startLine, sr.startOffset);
            updatePlaceholder(); notifyChange();
            return;
        }

        const lines = markdownSource.split('\n');
        const line = lines[sr.startLine] || '';
        if (sr.startOffset < line.length) {
            lines[sr.startLine] = line.slice(0, sr.startOffset) + line.slice(sr.startOffset + 1);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.startOffset);
        } else if (sr.startLine < lines.length - 1) {
            lines[sr.startLine] += lines[sr.startLine + 1];
            lines.splice(sr.startLine + 1, 1);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.startOffset);
        }
        updatePlaceholder(); notifyChange();
    }

    function handleDeleteWord(direction) {
        // Simple: delete to word boundary
        const sr = getSelectionRange();
        if (!sr) return;
        if (!sr.collapsed) { handleBackspace(); return; }

        const lines = markdownSource.split('\n');
        const line = lines[sr.startLine] || '';
        pushUndo('delete');

        if (direction === 'backward') {
            if (sr.startOffset === 0) { handleBackspace(); return; }
            let i = sr.startOffset - 1;
            while (i > 0 && line[i - 1] === ' ') i--;
            while (i > 0 && line[i - 1] !== ' ') i--;
            lines[sr.startLine] = line.slice(0, i) + line.slice(sr.startOffset);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, i);
        } else {
            if (sr.startOffset >= line.length) { handleDelete(); return; }
            let i = sr.startOffset;
            while (i < line.length && line[i] !== ' ') i++;
            while (i < line.length && line[i] === ' ') i++;
            lines[sr.startLine] = line.slice(0, sr.startOffset) + line.slice(i);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.startOffset);
        }
        updatePlaceholder(); notifyChange();
    }

    function handlePaste(text) {
        const sr = getSelectionRange();
        if (!sr) return;
        // Pasting a URL over selected text links the selection instead of
        // replacing it: the phone-friendly way to make a link (the toolbar
        // has no link button).
        const url = text.trim();
        if (!sr.collapsed && sr.startLine === sr.endLine &&
            /^https?:\/\/\S+$/.test(url)) {
            const lines = markdownSource.split('\n');
            const line = lines[sr.startLine] || '';
            const inner = line.slice(sr.startOffset, sr.endOffset);
            if (!inner.includes('[') && !inner.includes(']')) {
                pushUndo('paste');
                const rep = '[' + inner + '](' + url + ')';
                lines[sr.startLine] = line.slice(0, sr.startOffset) + rep + line.slice(sr.endOffset);
                markdownSource = lines.join('\n');
                render(); setCursor(sr.startLine, sr.startOffset + rep.length);
                updatePlaceholder(); notifyChange();
                return;
            }
        }
        pushUndo('paste');
        if (!sr.collapsed) {
            deleteRangeRaw(sr.startLine, sr.startOffset, sr.endLine, sr.endOffset);
        }
        const pos = { line: sr.startLine, offset: sr.startOffset };
        const pasteLines = text.split('\n');
        const lines = markdownSource.split('\n');
        const currentLine = lines[pos.line] || '';
        const before = currentLine.slice(0, pos.offset);
        const after = currentLine.slice(pos.offset);

        if (pasteLines.length === 1) {
            lines[pos.line] = before + pasteLines[0] + after;
            markdownSource = lines.join('\n');
            render(); setCursor(pos.line, pos.offset + pasteLines[0].length);
        } else {
            const newLines = lines.slice(0, pos.line);
            newLines.push(before + pasteLines[0]);
            for (let i = 1; i < pasteLines.length - 1; i++) newLines.push(pasteLines[i]);
            newLines.push(pasteLines[pasteLines.length - 1] + after);
            for (let i = pos.line + 1; i < lines.length; i++) newLines.push(lines[i]);
            markdownSource = newLines.join('\n');
            const lastLine = pos.line + pasteLines.length - 1;
            render(); setCursor(lastLine, pasteLines[pasteLines.length - 1].length);
        }
        updatePlaceholder(); notifyChange();
    }

    function deleteRangeRaw(startLine, startOff, endLine, endOff) {
        const lines = markdownSource.split('\n');
        const before = (lines[startLine] || '').slice(0, startOff);
        const after = (lines[endLine] || '').slice(endOff);
        const newLines = lines.slice(0, startLine);
        newLines.push(before + after);
        for (let i = endLine + 1; i < lines.length; i++) newLines.push(lines[i]);
        markdownSource = newLines.join('\n');
    }

    function deleteRangeAndInsert(startLine, startOff, endLine, endOff, text) {
        deleteRangeRaw(startLine, startOff, endLine, endOff);
        const lines = markdownSource.split('\n');
        const line = lines[startLine] || '';
        lines[startLine] = line.slice(0, startOff) + text + line.slice(startOff);
        markdownSource = lines.join('\n');
        render(); setCursor(startLine, startOff + text.length);
        updatePlaceholder(); notifyChange();
    }

    function syncCurrentLineFromDOM() {
        const pos = getCursorPos();
        if (!pos) return;
        const lineDiv = editor.querySelector('[data-line="' + pos.line + '"]');
        if (!lineDiv) return;
        const domText = lineDiv.textContent;
        const lines = markdownSource.split('\n');
        if (lines[pos.line] !== domText) {
            pushUndo('input');
            lines[pos.line] = domText;
            markdownSource = lines.join('\n');
            render(); setCursor(pos.line, pos.offset);
            updatePlaceholder(); notifyChange();
        }
    }

    function syncAllFromDOM() {
        const pos = getCursorPos();
        const divs = editor.querySelectorAll('[data-line]');
        const lines = [];
        divs.forEach(div => { lines.push(div.textContent); });
        if (lines.length > 0) {
            pushUndo('input');
            markdownSource = lines.join('\n');
            render();
            if (pos) setCursor(pos.line, pos.offset);
            updatePlaceholder(); notifyChange();
        }
    }

    // ========================================
    // RENDERING
    // ========================================
    // Key rule: every line div's textContent must === the markdown source line.
    // Styling is done via spans that wrap parts of the text, but ALL text is present.

    // The pure line renderer lives in render.js (loaded before this script)
    // so it can be unit-tested in JavaScriptCore. It must produce, for every
    // line, a div whose textContent === the source line.
    function render() {
        editor.innerHTML = renderMarkdown(markdownSource);
        if (searchQuery) highlightSearch();
    }

    // ========================================
    // FORMATTING (invoked from the keyboard accessory bar)
    // ========================================
    function wrapInline(token) {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('format');
        const lines = markdownSource.split('\n');
        if (sr.collapsed) {
            const line = lines[sr.startLine] || '';
            lines[sr.startLine] = line.slice(0, sr.startOffset) + token + token + line.slice(sr.startOffset);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.startOffset + token.length);
        } else if (sr.startLine === sr.endLine) {
            const line = lines[sr.startLine] || '';
            const inner = line.slice(sr.startOffset, sr.endOffset);
            lines[sr.startLine] = line.slice(0, sr.startOffset) + token + inner + token + line.slice(sr.endOffset);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.endOffset + token.length * 2);
        } else {
            const s = lines[sr.startLine] || '';
            lines[sr.startLine] = s.slice(0, sr.startOffset) + token + s.slice(sr.startOffset);
            const e = lines[sr.endLine] || '';
            lines[sr.endLine] = e.slice(0, sr.endOffset) + token + e.slice(sr.endOffset);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.endLine, sr.endOffset + token.length);
        }
        updatePlaceholder(); notifyChange();
    }

    function toggleLinePrefix(prefix) {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('format');
        const lines = markdownSource.split('\n');
        const idx = sr.startLine;
        const line = lines[idx] || '';
        if (line.startsWith(prefix)) {
            lines[idx] = line.slice(prefix.length);
            markdownSource = lines.join('\n');
            render(); setCursor(idx, Math.max(0, sr.startOffset - prefix.length));
        } else {
            const stripped = line.replace(/^(#{1,6}\s+|>\s?|[-*+]\s+\[[ xX]\]\s+|[-*+]\s+|\d+\.\s+)/, '');
            const removed = line.length - stripped.length;
            lines[idx] = prefix + stripped;
            markdownSource = lines.join('\n');
            render(); setCursor(idx, Math.max(prefix.length, sr.startOffset - removed + prefix.length));
        }
        updatePlaceholder(); notifyChange();
    }

    function insertLink() {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('format');
        const lines = markdownSource.split('\n');
        const line = lines[sr.startLine] || '';
        if (!sr.collapsed && sr.startLine === sr.endLine) {
            const inner = line.slice(sr.startOffset, sr.endOffset);
            const rep = '[' + inner + '](url)';
            lines[sr.startLine] = line.slice(0, sr.startOffset) + rep + line.slice(sr.endOffset);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.startOffset + inner.length + 3);
        } else {
            const rep = '[title](url)';
            lines[sr.startLine] = line.slice(0, sr.startOffset) + rep + line.slice(sr.startOffset);
            markdownSource = lines.join('\n');
            render(); setCursor(sr.startLine, sr.startOffset + 1);
        }
        updatePlaceholder(); notifyChange();
    }

    window.fmtBold = function() { wrapInline('**'); };
    window.fmtItalic = function() { wrapInline('*'); };
    // One button walks the heading sizes instead of only toggling H1:
    // plain -> H1 -> H2 -> H3 -> plain.
    window.fmtHeading = function() {
        const sr = getSelectionRange();
        if (!sr) return;
        const line = markdownSource.split('\n')[sr.startLine] || '';
        const m = line.match(/^(#{1,6})\s/);
        const level = m ? m[1].length : 0;
        setHeadingLevel(level >= 3 ? 0 : level + 1);
    };
    window.fmtBullet = function() { toggleLinePrefix('- '); };
    window.fmtTask = function() { toggleLinePrefix('- [ ] '); };
    window.fmtLink = function() { insertLink(); };
    // Same walk for callouts: note -> tip -> important -> warning ->
    // caution -> plain line. First press wraps the line as a note callout.
    const calloutTypes = ['note', 'tip', 'important', 'warning', 'caution'];
    window.fmtCallout = function() {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('format');
        const lines = markdownSource.split('\n');
        const idx = sr.startLine;
        const line = lines[idx] || '';
        const m = line.match(/^>\s?\[!(\w+)\]\s?(.*)$/i);
        if (m) {
            const cur = calloutTypes.indexOf(m[1].toLowerCase());
            const next = (cur >= 0 && cur < calloutTypes.length - 1) ? calloutTypes[cur + 1] : null;
            lines[idx] = next ? '> [!' + next + '] ' + m[2] : m[2];
        } else {
            const stripped = line.replace(/^(#{1,6}\s+|>\s?|[-*+]\s+\[[ xX]\]\s+|[-*+]\s+|\d+\.\s+)/, '');
            lines[idx] = '> [!note] ' + stripped;
        }
        markdownSource = lines.join('\n');
        render(); setCursor(idx, lines[idx].length);
        updatePlaceholder(); notifyChange();
    };

    // Set the current line to exactly heading level n (0 = plain paragraph),
    // replacing whatever block prefix is there. The Mac Paragraph menu's
    // Heading 1-6 / Paragraph items, matching Typora's Cmd+0-6.
    function setHeadingLevel(n) {
        const sr = getSelectionRange();
        if (!sr) return;
        pushUndo('format');
        const lines = markdownSource.split('\n');
        const idx = sr.startLine;
        const line = lines[idx] || '';
        const stripped = line.replace(/^(#{1,6}\s+|>\s?|[-*+]\s+\[[ xX]\]\s+|[-*+]\s+|\d+\.\s+)/, '');
        const removed = line.length - stripped.length;
        const prefix = n > 0 ? '#'.repeat(n) + ' ' : '';
        lines[idx] = prefix + stripped;
        markdownSource = lines.join('\n');
        render(); setCursor(idx, Math.max(prefix.length, sr.startOffset - removed + prefix.length));
        updatePlaceholder(); notifyChange();
    }

    const fmtActions = {
        bold: window.fmtBold, italic: window.fmtItalic, heading: window.fmtHeading,
        bullet: window.fmtBullet, task: window.fmtTask, link: window.fmtLink,
        callout: window.fmtCallout,
        strike: () => wrapInline('~~'),
        code: () => wrapInline('`'),
        quote: () => toggleLinePrefix('> '),
        ordered: () => toggleLinePrefix('1. '),
        paragraph: () => setHeadingLevel(0),
        h1: () => setHeadingLevel(1), h2: () => setHeadingLevel(2),
        h3: () => setHeadingLevel(3), h4: () => setHeadingLevel(4),
        h5: () => setHeadingLevel(5), h6: () => setHeadingLevel(6),
        // The native picker steals focus, so remember where the image goes
        // before asking for one; insertPastedImage restores it.
        attach: () => {
            const sr = getSelectionRange();
            attachReturnPos = sr ? { line: sr.startLine, offset: sr.startOffset } : null;
            postToHost({ action: 'attachImage' });
        },
        // The sketch pad also steals focus; same caret bookmark as attach.
        sketch: () => {
            const sr = getSelectionRange();
            attachReturnPos = sr ? { line: sr.startLine, offset: sr.startOffset } : null;
            postToHost({ action: 'sketchImage' });
        }
    };

    // Menu-bar formatting (Mac): the host invokes actions by name.
    window.runFormat = function(name) {
        const action = fmtActions[name];
        if (action) { editor.focus(); action(); }
    };

    // Outline navigation: scroll a source line to the top of the view.
    window.scrollToLine = function(i) {
        const div = editor.querySelector('.line[data-line="' + i + '"]');
        if (div) div.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    const toolbar = document.getElementById('toolbar');
    toolbar.querySelectorAll('button').forEach(btn => {
        // Keep the editor's selection/focus when a toolbar button is tapped.
        // Preventing touchstart's default also suppresses the synthesized
        // click on iOS, so the action must run from touchend there; click
        // stays for pointer devices (the Mac web view).
        const run = () => {
            const action = fmtActions[btn.dataset.fmt];
            if (action) action();
        };
        let ranFromTouch = false;
        btn.addEventListener('mousedown', e => e.preventDefault());
        btn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
        btn.addEventListener('touchend', e => {
            e.preventDefault();
            ranFromTouch = true;
            run();
        }, { passive: false });
        btn.addEventListener('click', e => {
            e.preventDefault();
            if (ranFromTouch) { ranFromTouch = false; return; }
            run();
        });
    });

    function positionToolbar() {
        const vv = window.visualViewport;
        if (!vv) return;
        const inset = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
        toolbar.style.bottom = inset + 'px';
    }
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', positionToolbar);
        window.visualViewport.addEventListener('scroll', positionToolbar);
    }
    // The formatting bar exists for touch keyboards; on the Mac the Format
    // and Paragraph menus (plus shortcuts) do this job, so the bar stays off.
    const touchDevice = 'ontouchstart' in window;
    editor.addEventListener('focus', () => { if (touchDevice) { toolbar.classList.add('visible'); positionToolbar(); } });
    editor.addEventListener('blur', () => {
        setTimeout(() => {
            if (document.activeElement !== editor) toolbar.classList.remove('visible');
        }, 120);
    });

    // ========================================
    // FIND IN NOTE
    // ========================================
    let searchQuery = '';
    let searchMatches = [];
    let searchIndex = -1;

    window.setSearch = function(query) {
        searchQuery = query || '';
        render();
        searchIndex = searchMatches.length ? 0 : -1;
        markCurrent();
        scrollToCurrent();
        return searchMatches.length;
    };
    window.searchNext = function() {
        if (!searchMatches.length) return 0;
        searchIndex = (searchIndex + 1) % searchMatches.length;
        markCurrent(); scrollToCurrent();
        return searchIndex + 1;
    };
    window.searchPrev = function() {
        if (!searchMatches.length) return 0;
        searchIndex = (searchIndex - 1 + searchMatches.length) % searchMatches.length;
        markCurrent(); scrollToCurrent();
        return searchIndex + 1;
    };
    window.clearSearch = function() {
        searchQuery = '';
        searchMatches = [];
        searchIndex = -1;
        render();
    };

    // Replace works on the markdown source (the source of truth), so the edit
    // saves and undoes like any other. Matching is case-insensitive, to line up
    // with find. Returns how many occurrences were replaced.
    window.replaceCurrent = function(query, replacement) {
        query = query || ''; replacement = replacement || '';
        if (!query) return 0;
        const q = query.toLowerCase();
        const lower = markdownSource.toLowerCase();
        // Target the occurrence the find bar is on; fall back to the first.
        const target = searchIndex >= 0 ? searchIndex : 0;
        let from = 0, n = 0, at = -1;
        while (true) {
            const found = lower.indexOf(q, from);
            if (found === -1) break;
            if (n === target) { at = found; break; }
            from = found + q.length; n++;
        }
        if (at === -1) at = lower.indexOf(q);
        if (at === -1) return 0;
        pushUndo('replace');
        markdownSource = markdownSource.slice(0, at) + replacement + markdownSource.slice(at + q.length);
        render();
        notifyChange();
        if (searchQuery) window.setSearch(searchQuery);
        return 1;
    };

    window.replaceAll = function(query, replacement) {
        query = query || ''; replacement = replacement || '';
        if (!query) return 0;
        const q = query.toLowerCase();
        const lower = markdownSource.toLowerCase();
        let count = 0, i = 0, result = '';
        while (true) {
            const found = lower.indexOf(q, i);
            if (found === -1) { result += markdownSource.slice(i); break; }
            result += markdownSource.slice(i, found) + replacement;
            i = found + q.length;
            count++;
        }
        if (!count) return 0;
        pushUndo('replace');
        markdownSource = result;
        render();
        notifyChange();
        if (searchQuery) window.setSearch(searchQuery);
        return count;
    };

    function highlightSearch() {
        searchMatches = [];
        const q = searchQuery.toLowerCase();
        if (!q) return;
        const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let node;
        while ((node = walker.nextNode())) nodes.push(node);
        nodes.forEach(textNode => {
            const text = textNode.nodeValue;
            const lower = text.toLowerCase();
            if (lower.indexOf(q) === -1) return;
            const frag = document.createDocumentFragment();
            let last = 0, idx = lower.indexOf(q);
            while (idx !== -1) {
                if (idx > last) frag.appendChild(document.createTextNode(text.slice(last, idx)));
                const mark = document.createElement('mark');
                mark.className = 'search-hit';
                mark.textContent = text.slice(idx, idx + q.length);
                frag.appendChild(mark);
                searchMatches.push(mark);
                last = idx + q.length;
                idx = lower.indexOf(q, last);
            }
            if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
            textNode.parentNode.replaceChild(frag, textNode);
        });
    }

    function markCurrent() {
        searchMatches.forEach((m, i) => {
            if (i === searchIndex) m.classList.add('current');
            else m.classList.remove('current');
        });
    }

    function scrollToCurrent() {
        if (searchIndex >= 0 && searchMatches[searchIndex]) {
            searchMatches[searchIndex].scrollIntoView({ block: 'center' });
        }
    }

    // ========================================
    // UNDO / REDO
    // ========================================
    // Every mutating op calls pushUndo() *before* changing markdownSource,
    // snapshotting the pre-edit document and caret. Rapid same-kind edits
    // (typing, deleting) coalesce into a single step so undo works by word/pause
    // rather than per keystroke.
    function pushUndo(type) {
        const now = (window.performance && performance.now) ? performance.now() : 0;
        if ((type === 'insertText' || type === 'delete') &&
            type === lastEditType && (now - lastEditAt) < 700) {
            lastEditAt = now;
            return;
        }
        lastEditType = type;
        lastEditAt = now;
        const snap = captureState();
        // Skip no-op edits and double-pushes (a delegating op may push twice).
        if (undoStack.length && undoStack[undoStack.length - 1].md === snap.md) return;
        undoStack.push(snap);
        if (undoStack.length > 1000) undoStack.shift();
        redoStack.length = 0;
    }

    function captureState() {
        const pos = getCursorPos();
        return { md: markdownSource, line: pos ? pos.line : 0, offset: pos ? pos.offset : 0 };
    }

    function restoreState(s) {
        markdownSource = s.md;
        render();
        setCursor(s.line, s.offset);
        updatePlaceholder();
        notifyChange();
        lastEditType = null;
        lastEditAt = 0;
    }

    window.undo = function() {
        if (!undoStack.length) return;
        redoStack.push(captureState());
        restoreState(undoStack.pop());
    };
    window.redo = function() {
        if (!redoStack.length) return;
        undoStack.push(captureState());
        restoreState(redoStack.pop());
    };

    // ========================================
    // TASK TOGGLE
    // ========================================
    window.toggleTask = function(lineIdx) {
        const lines = markdownSource.split('\n');
        if (lineIdx < lines.length) {
            pushUndo('task');
            if (/\[ \]/.test(lines[lineIdx])) {
                lines[lineIdx] = lines[lineIdx].replace('[ ]', '[x]');
            } else {
                lines[lineIdx] = lines[lineIdx].replace(/\[[xX]\]/, '[ ]');
            }
            markdownSource = lines.join('\n');
            render(); notifyChange();
        }
    };

    // ========================================
    // ACTIVE LINE (reveals raw syntax on the line being edited)
    // ========================================
    function updateActiveLine() {
        const prev = editor.querySelector('.line.active-line');
        const pos = getCursorPos();
        const next = pos ? editor.querySelector('[data-line="' + pos.line + '"]') : null;
        if (prev === next) return;
        if (prev) prev.classList.remove('active-line');
        if (next) next.classList.add('active-line');
    }
    document.addEventListener('selectionchange', updateActiveLine);

    // Tap or click a rendered checkbox to toggle it. pointerdown (fires for both
    // touch and mouse) performs the toggle. On macOS the caret is placed on
    // mousedown, and preventing pointerdown's default does not stop it -- so we
    // must also preventDefault on mousedown. Otherwise the click activates the
    // line, which hides the visual box and reveals the raw "- [ ]" markdown
    // instead of toggling.
    function checkboxFor(e) {
        const cb = e.target.closest('.task-cb-vis');
        return (cb && cb.dataset.line !== undefined) ? cb : null;
    }
    editor.addEventListener('mousedown', (e) => {
        if (checkboxFor(e)) e.preventDefault();
    });
    editor.addEventListener('pointerdown', (e) => {
        const cb = checkboxFor(e);
        if (cb) {
            e.preventDefault();
            window.toggleTask(parseInt(cb.dataset.line));
        }
    });

    // ========================================
    // SCROLL
    // ========================================
    function scrollCursorIntoView() {
        setTimeout(() => {
            const sel = window.getSelection();
            if (sel.rangeCount) {
                const rect = sel.getRangeAt(0).getBoundingClientRect();
                if (rect.bottom > window.innerHeight - 60) {
                    window.scrollTo(0, window.scrollY + rect.bottom - window.innerHeight + 80);
                }
            }
        }, 50);
    }
    editor.addEventListener('focus', scrollCursorIntoView);

    // ========================================
    // OUTLINE SCROLL SYNC
    // ========================================
    // Smoothly jump to a heading when its outline row is clicked.
    window.scrollToLine = function(n) {
        const div = editor.querySelector('[data-line="' + n + '"]');
        if (!div) return;
        const top = window.scrollY + div.getBoundingClientRect().top - 8;
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    };

    // Report the heading currently at the top of the viewport so the outline can
    // highlight the section being read. Throttled to one report per frame.
    let lastReportedHeading = null;
    function topVisibleHeadingLine() {
        const heads = editor.querySelectorAll('.line-h1, .line-h2, .line-h3, .line-h4, .line-h5, .line-h6');
        let current = -1;
        for (const div of heads) {
            if (div.getBoundingClientRect().top <= 80) current = parseInt(div.dataset.line);
            else break;
        }
        return current;
    }
    function reportHeading() {
        const line = topVisibleHeadingLine();
        if (line === lastReportedHeading) return;
        lastReportedHeading = line;
        postToHost({ action: 'scrollLine', line: line });
    }
    let scrollPending = false;
    window.addEventListener('scroll', () => {
        if (scrollPending) return;
        scrollPending = true;
        requestAnimationFrame(() => { scrollPending = false; reportHeading(); });
    }, { passive: true });
})();
</script>
</body>
</html>
